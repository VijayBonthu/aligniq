name: Backend deploy

# Branch → environment:
#   push to `staging` → GitHub Environment "staging"  (auto-deploy)
#   push to `main`    → GitHub Environment "production" (PAUSES for the required
#                       reviewer configured on that environment = the approval gate)
on:
  push:
    branches: [staging, main]
    paths:
      - "src/**"
      - "alembic/**"
      - "alembic.ini"
      - "requirements.txt"
      - "Dockerfile"
      - "entrypoint.sh"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

# OIDC needs id-token write; contents read is enough for actions/checkout.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

# Never run two deploys to the same environment at once.
concurrency:
  group: backend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # The environment selects the per-env secrets/vars AND enforces the production
    # approval gate. main→production, anything else (staging)→staging.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      # OIDC: no long-lived AWS keys. Role ARN is an environment secret (the
      # staging role trusts environment:staging, the prod role environment:production).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ECR_REPO is an environment variable: groundediq-api (staging) /
      # groundediq-production-api (production).
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPO }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SSM Run-Command — no SSH. Order matters and `set -e` makes it safe:
      #   1. pull the new image
      #   2. run `alembic upgrade head` from the NEW image (DB creds come from SSM
      #      via entrypoint.sh). If a migration fails, the script aborts here and
      #      the OLD container keeps serving — we never flip to a half-migrated app.
      #   3. restart only the api container (redis keeps running)
      - name: Migrate + redeploy via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          COMPOSE=/usr/local/lib/docker/cli-plugins/docker-compose
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GH deploy ${{ github.sha }} (${{ github.ref_name }})" \
            --parameters "commands=[
              \"set -euxo pipefail\",
              \"cd /opt/groundediq\",
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY\",
              \"$COMPOSE pull api\",
              \"$COMPOSE run --rm --no-deps api alembic upgrade head\",
              \"$COMPOSE up -d api\",
              \"docker image prune -f\"
            ]" \
            --query "Command.CommandId" --output text)
          echo "Command ID: $CMD_ID"

          # Poll until terminal so the workflow fails loudly on a broken
          # migration/pull instead of going green. 180 * 5s = 15 min.
          for i in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[$i] status=$STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
                exit 1 ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for SSM command"
          exit 1
