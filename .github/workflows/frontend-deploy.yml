name: Frontend deploy

# Branch → environment (same model as backend-deploy):
#   push to `staging` → staging bucket; push to `main` → production bucket (gated).
on:
  push:
    branches: [staging, main]
    paths:
      - "frontend_green/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

concurrency:
  group: frontend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    defaults:
      run:
        working-directory: frontend_green

    steps:
      - uses: actions/checkout@v4

      # NOTE: npm cache intentionally NOT enabled here. npm/cli#4828 can persist a
      # bad optional-dep state in ~/.npm, so a restored cache makes even a clean
      # reinstall keep skipping the rollup binary. Fresh install every run is worth
      # the ~30s to keep the build deterministic.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `npm ci` on Linux hits npm/cli#4828 — it installs from the lockfile but
      # SKIPS the platform-specific rollup binary (@rollup/rollup-linux-x64-gnu),
      # so vite/rollup fail with "Cannot find module". The bundled npm (10.8) has
      # the bug; npm 10.9+ fixed it. So: upgrade npm, wipe any partial state, and
      # do a clean install that resolves the correct native binary for the runner.
      - name: Install dependencies
        run: |
          npm install -g npm@latest
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund

      # Vite inlines VITE_* at build time, so anything the SPA needs baked in must
      # be set here. VITE_API_URL and VITE_TURNSTILE_SITE_KEY are per-environment
      # variables (staging vs production). Trim stray whitespace/newline so Vite
      # doesn't bake in ".../api/v1%20/..." or a key with a trailing newline.
      # (The Stripe publishable key is NOT here — the SPA fetches it at runtime
      # from GET /billing/publishable-key.)
      - name: Build
        env:
          VITE_API_URL_RAW: ${{ vars.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY_RAW: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          export VITE_API_URL="$(printf '%s' "$VITE_API_URL_RAW" | tr -d '[:space:]')"
          export VITE_TURNSTILE_SITE_KEY="$(printf '%s' "$VITE_TURNSTILE_SITE_KEY_RAW" | tr -d '[:space:]')"
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # FRONTEND_BUCKET is an environment variable (staging.grounded-iq.com /
      # grounded-iq.com). Hashed assets get a 1-year immutable cache; index.html
      # is no-cache so a deploy is visible immediately (Cloudflare honours these).
      - name: Upload hashed assets to S3
        env:
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          BUCKET="$(printf '%s' "$FRONTEND_BUCKET" | tr -d '[:space:]')"
          aws s3 sync dist/ "s3://${BUCKET}/" --delete --cache-control "public,max-age=31536000,immutable" --exclude "index.html"

      - name: Upload index.html (no cache, correct content-type)
        env:
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          BUCKET="$(printf '%s' "$FRONTEND_BUCKET" | tr -d '[:space:]')"
          aws s3 cp dist/index.html "s3://${BUCKET}/index.html" --cache-control "public,max-age=0,must-revalidate" --content-type "text/html"
