name: Frontend deploy

# Branch → environment (same model as backend-deploy):
#   push to `staging` → staging bucket; push to `main` → production bucket (gated).
on:
  push:
    branches: [staging, main]
    paths:
      - "frontend_green/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

concurrency:
  group: frontend-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    defaults:
      run:
        working-directory: frontend_green

    steps:
      - uses: actions/checkout@v4

      # NOTE: npm cache intentionally NOT enabled here. npm/cli#4828 can persist a
      # bad optional-dep state in ~/.npm, so a restored cache makes even a clean
      # reinstall keep skipping the rollup binary. Fresh install every run is worth
      # the ~30s to keep the build deterministic.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `npm ci` on Linux hits npm/cli#4828 — it installs from the lockfile but
      # SKIPS the platform-specific rollup binary (@rollup/rollup-linux-x64-gnu),
      # so vite/rollup fail with "Cannot find module". The bundled npm (10.8) has
      # the bug; npm 10.9+ fixed it. So: upgrade npm, wipe any partial state, and
      # do a clean install that resolves the correct native binary for the runner.
      - name: Install dependencies
        run: |
          npm install -g npm@latest
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund

      # Vite inlines VITE_* at build time, so anything the SPA needs baked in must
      # be set here. VITE_API_URL and VITE_TURNSTILE_SITE_KEY are per-environment
      # variables (staging vs production). Trim stray whitespace/newline so Vite
      # doesn't bake in ".../api/v1%20/..." or a key with a trailing newline.
      # (The Stripe publishable key is NOT here — the SPA fetches it at runtime
      # from GET /billing/publishable-key.)
      #
      # Feature flags below are read directly from the env by Vite (they need no
      # transform). MUST be listed here or the GitHub Actions variable is invisible
      # to the build and the feature silently stays off:
      #   VITE_LAUNCH_OFFER      — "true" shows the pricing-page launch-discount banner + card prices
      #   VITE_PLAUSIBLE_DOMAIN  — set to enable cookieless analytics (lib/analytics.ts)
      - name: Build
        env:
          VITE_API_URL_RAW: ${{ vars.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY_RAW: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_LAUNCH_OFFER: ${{ vars.VITE_LAUNCH_OFFER }}
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.VITE_PLAUSIBLE_DOMAIN }}
        run: |
          export VITE_API_URL="$(printf '%s' "$VITE_API_URL_RAW" | tr -d '[:space:]')"
          export VITE_TURNSTILE_SITE_KEY="$(printf '%s' "$VITE_TURNSTILE_SITE_KEY_RAW" | tr -d '[:space:]')"
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # FRONTEND_BUCKET is an environment variable (staging.grounded-iq.com /
      # grounded-iq.com). Hashed JS/CSS/image assets get a 1-year immutable cache.
      # HTML + sitemap/robots are handled in the next step (they must not be immutable
      # and the per-route HTML needs extensionless keys). --delete prunes stale assets;
      # it also prunes the extensionless route keys (they're not in dist/), which the
      # next step re-creates immediately.
      - name: Upload hashed assets to S3
        env:
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          BUCKET="$(printf '%s' "$FRONTEND_BUCKET" | tr -d '[:space:]')"
          aws s3 sync dist/ "s3://${BUCKET}/" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" --exclude "sitemap.xml" --exclude "robots.txt"

      # Per-route prerendered HTML. `npm run build` runs scripts/prerender-meta.mjs,
      # which writes dist/index.html plus dist/<route>.html for every public route in
      # src/seo/routes.mjs — each with its own title/description/canonical/OG/JSON-LD.
      # We upload each dist/<route>.html to the EXTENSIONLESS S3 key (e.g. dist/pricing.html
      # -> key "pricing") so S3 serves /pricing at HTTP 200 with that page's real HTML.
      # index.html serves "/". All HTML is no-cache so a deploy is visible immediately.
      # sitemap.xml/robots.txt get a short cache. Deriving the route list from the built
      # files means new routes need no change here — just add them to routes.mjs.
      - name: Upload prerendered HTML + sitemap/robots
        env:
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          BUCKET="$(printf '%s' "$FRONTEND_BUCKET" | tr -d '[:space:]')"
          aws s3 cp dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "public,max-age=0,must-revalidate" --content-type "text/html"
          for f in dist/*.html; do
            name="$(basename "$f" .html)"
            [ "$name" = "index" ] && continue
            aws s3 cp "$f" "s3://${BUCKET}/${name}" \
              --cache-control "public,max-age=0,must-revalidate" --content-type "text/html"
          done
          aws s3 cp dist/sitemap.xml "s3://${BUCKET}/sitemap.xml" \
            --cache-control "public,max-age=3600" --content-type "application/xml"
          if [ -f dist/robots.txt ]; then
            aws s3 cp dist/robots.txt "s3://${BUCKET}/robots.txt" \
              --cache-control "public,max-age=3600" --content-type "text/plain"
          fi
