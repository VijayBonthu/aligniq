# Alembic configuration for GroundedIQ.
#
# The DB URL is NOT stored here — env.py builds it from src/config.py:settings
# (which reads POSTGRES_* from the environment / SSM). This keeps a single source
# of truth and avoids committing credentials.
#
# Run from the repo root (locally) or /app (in the container, WORKDIR=/app):
#   alembic upgrade head            # apply all pending migrations
#   alembic revision --autogenerate -m "describe change"
#   alembic stamp head              # mark an already-migrated DB without running

[alembic]
script_location = alembic

# Put the app's source dir on sys.path so env.py can `import config` / `import models`
# exactly as the app does (app modules import each other top-level, not as src.*).
# Relative to this file's location; works both at repo root and at /app in the image.
prepend_sys_path = src

# Use OS-native path separators.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
